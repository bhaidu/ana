<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dravya Multi-Unit & INR Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-fuchsia-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-white/20">
    
    <!-- Colorful Gradient Header -->
    <div class="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-amber-500 p-6 md:p-7 text-white">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-sm">Dravya Converter</h1>
          <p class="text-xs text-white/90 font-medium mt-1">1 Dravya = 100 Cells = 10k Binds = 1M Atoms</p>
        </div>
        <div class="text-right">
          <span id="rateBadge" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-white/20 text-white backdrop-blur-sm border border-white/30 shadow-sm">
            Loading rate...
          </span>
        </div>
      </div>
    </div>

    <div class="p-6 md:p-8">
      <!-- Input & Dropdown Row -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-purple-900 mb-2">Enter Amount & Select Unit</label>
        <div class="flex rounded-2xl shadow-md overflow-hidden ring-2 ring-purple-200 focus-within:ring-fuchsia-500 transition">
          <input 
            type="number" 
            id="amountInput" 
            value="1" 
            step="any" 
            min="0"
            oninput="calculate()"
            placeholder="0.00"
            class="w-2/3 bg-purple-50/40 px-4 py-3.5 text-xl font-bold text-slate-900 focus:bg-white focus:outline-none"
          >
          <select 
            id="unitSelect" 
            onchange="calculate()"
            class="w-1/3 bg-gradient-to-r from-violet-600 to-fuchsia-600 px-3 py-3.5 text-base font-bold text-white focus:outline-none cursor-pointer"
          >
            <option value="dravya" class="text-slate-900 font-semibold" selected>Dravya</option>
            <option value="cell" class="text-slate-900 font-semibold">Cell</option>
            <option value="bind" class="text-slate-900 font-semibold">Bind</option>
            <option value="atom" class="text-slate-900 font-semibold">Atom</option>
          </select>
        </div>
      </div>

      <!-- Fiat Valuation Cards -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-gradient-to-br from-blue-500 to-cyan-500 rounded-2xl p-4 text-white shadow-lg shadow-cyan-500/20">
          <p class="text-xs font-bold uppercase tracking-wider text-blue-100">Total USD Value</p>
          <p id="usdTotal" class="text-xl md:text-2xl font-extrabold mt-1 break-all drop-shadow-sm">$0.00</p>
        </div>
        <div class="bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl p-4 text-white shadow-lg shadow-emerald-500/20">
          <p class="text-xs font-bold uppercase tracking-wider text-emerald-100">Total INR Value</p>
          <p id="inrTotal" class="text-xl md:text-2xl font-extrabold mt-1 break-all drop-shadow-sm">₹0.00</p>
        </div>
      </div>

      <!-- Color-Coded Cross-Unit Breakdown -->
      <div>
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-purple-400 mb-3">Equivalent Units</h2>
        <div class="space-y-2.5">
          
          <!-- Dravya Row -->
          <div class="flex justify-between items-center p-3.5 rounded-xl bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-gradient-to-r from-amber-500 to-orange-500"></span>
              <div>
                <span class="font-bold text-amber-950">Dravya</span>
                <span class="text-xs text-amber-700 block font-medium">$100 / unit</span>
              </div>
            </div>
            <span id="resDravya" class="font-mono font-bold text-lg text-amber-900">0</span>
          </div>

          <!-- Cell Row -->
          <div class="flex justify-between items-center p-3.5 rounded-xl bg-gradient-to-r from-fuchsia-50 to-pink-50 border border-fuchsia-200 hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-gradient-to-r from-fuchsia-500 to-pink-500"></span>
              <div>
                <span class="font-bold text-fuchsia-950">Cells</span>
                <span class="text-xs text-fuchsia-700 block font-medium">$1 / unit</span>
              </div>
            </div>
            <span id="resCell" class="font-mono font-bold text-lg text-fuchsia-900">0</span>
          </div>

          <!-- Bind Row -->
          <div class="flex justify-between items-center p-3.5 rounded-xl bg-gradient-to-r from-violet-50 to-indigo-50 border border-violet-200 hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-gradient-to-r from-violet-500 to-indigo-500"></span>
              <div>
                <span class="font-bold text-violet-950">Binds</span>
                <span class="text-xs text-violet-700 block font-medium">$0.01 / unit</span>
              </div>
            </div>
            <span id="resBind" class="font-mono font-bold text-lg text-violet-900">0</span>
          </div>

          <!-- Atom Row -->
          <div class="flex justify-between items-center p-3.5 rounded-xl bg-gradient-to-r from-sky-50 to-cyan-50 border border-sky-200 hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-gradient-to-r from-sky-500 to-cyan-500"></span>
              <div>
                <span class="font-bold text-sky-950">Atoms</span>
                <span class="text-xs text-sky-700 block font-medium">$0.0001 / unit</span>
              </div>
            </div>
            <span id="resAtom" class="font-mono font-bold text-lg text-sky-900">0</span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    // Default exchange rate (1 USD to INR) used if API is offline
    let usdToInrRate = 92.82;

    // Multiplier of each unit relative to 1 Atom (Base Unit)
    const unitToAtoms = {
      atom: 1,
      bind: 100,
      cell: 10000,
      dravya: 1000000
    };

    // Fetch live USD to INR rate
    async function fetchLiveExchangeRate() {
      const badge = document.getElementById('rateBadge');
      try {
        const response = await fetch('https://er-api.com');
        const data = await response.json();
        if (data && data.rates && data.rates.INR) {
          usdToInrRate = data.rates.INR;
          badge.textContent = `Live: $1 = ₹${usdToInrRate.toFixed(2)}`;
        }
      } catch (error) {
        badge.textContent = `Rate: $1 = ₹${usdToInrRate.toFixed(2)}`;
        badge.classList.add('bg-amber-500/40');
      }
      calculate();
    }

    // Format numbers cleanly without trailing zeroes
    function formatNumber(num) {
      if (num === 0) return '0';
      if (num < 0.0001) return num.toExponential(4);
      return Number(num.toFixed(6)).toLocaleString('en-US', { maximumFractionDigits: 6 });
    }

    // Main calculation function
    function calculate() {
      const amount = parseFloat(document.getElementById('amountInput').value) || 0;
      const selectedUnit = document.getElementById('unitSelect').value;

      // 1. Convert everything to the base unit (Atoms)
      const totalAtoms = amount * unitToAtoms[selectedUnit];

      // 2. Calculate all unit equivalents
      const dravya = totalAtoms / unitToAtoms.dravya;
      const cell = totalAtoms / unitToAtoms.cell;
      const bind = totalAtoms / unitToAtoms.bind;
      const atom = totalAtoms;

      // 3. Calculate Fiat Values (1 Atom = $0.0001 USD)
      const totalUsd = totalAtoms * 0.0001;
      const totalInr = totalUsd * usdToInrRate;

      // 4. Update the UI
      document.getElementById('resDravya').textContent = formatNumber(dravya);
      document.getElementById('resCell').textContent = formatNumber(cell);
      document.getElementById('resBind').textContent = formatNumber(bind);
      document.getElementById('resAtom').textContent = formatNumber(atom);

      document.getElementById('usdTotal').textContent = '$' + totalUsd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
      document.getElementById('inrTotal').textContent = '₹' + totalInr.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }

    // Initialize on load
    fetchLiveExchangeRate();
  </script>
</body>
</html>
